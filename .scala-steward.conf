# jackson 2.22.0 regressed the @JsonIgnoreProperties case-insensitive fix
# (CVE-2026-54515, dependabot alert #7). 2.21.5 is patched and 2.22.1 carries
# the re-fix, so the floor moved to 2.22.1 when apache-avro 1.12.2 raised
# jackson-bom to it (see the build.sbt comment on `jacksonCore`). Keep both
# artifacts at or above 2.22.1 and never on 2.22.0.
updates.pin = [
  { groupId = "com.fasterxml.jackson.core", artifactId = "jackson-core", version = "2.22." },
  { groupId = "com.fasterxml.jackson.core", artifactId = "jackson-databind", version = "2.22." }
]
