# jackson 2.22.0 regressed the @JsonIgnoreProperties case-insensitive fix
# (CVE-2026-54515, dependabot alert #7). 2.22.1 carries the re-fix and is what
# apache-avro 1.12.2's parent BOM resolves, so the build is already past it.
#
# There is deliberately NO `updates.pin` here. A pin like `version = "2.22."`
# is a SERIES LOCK, not a floor: it would block Steward from ever proposing
# 2.23.x, and it matches 2.22.0 anyway so it does not even express "never
# 2.22.0". The previous `"2.21."` pin is the proof of that failure mode —
# 2.22.1 shipped OSV-clean and required by avro 1.12.2, yet the build sat on
# 2.21.5 until a human edited the pin by hand. Steward never proposes a
# version below the current one, so 2.22.0 is already unreachable from 2.22.1
# and a pin buys nothing but the stranding.
#
# `updates.ignore` below is the belt-and-braces form: it names the single bad
# version instead of locking a series, so 2.23.x and beyond still flow.
updates.ignore = [
  { groupId = "com.fasterxml.jackson.core", artifactId = "jackson-core", version = "2.22.0" },
  { groupId = "com.fasterxml.jackson.core", artifactId = "jackson-databind", version = "2.22.0" }
]
