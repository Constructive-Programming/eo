version: 2
updates:
  # Keep GitHub Actions pinned versions current (github-actions ecosystem) and
  # sbt library / plugin / Scala version upgrades (sbt ecosystem). Dependabot
  # has natively supported the `sbt` package ecosystem since May 2026
  # (github.blog changelog 2026-05-26) — before that, sbt updates were Scala
  # Steward's job, which is why Steward is retired in favor of Dependabot.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
  - package-ecosystem: "sbt"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "sbt"
