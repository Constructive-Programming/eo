# Categories for GitHub's auto-generated release notes (`--generate-notes`,
# appended below the curated CHANGELOG section by github-release.yml).
changelog:
  exclude:
    authors:
      # Scala Steward is retired (dependabot.yml now covers sbt); keep bot
      # PRs out of the auto-generated release notes.
      - dependabot[bot]
  categories:
    - title: "⚠️ Breaking changes"
      labels:
        - breaking-change
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
    - title: Performance & benchmarks
      labels:
        - performance
        - benchmarks
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
