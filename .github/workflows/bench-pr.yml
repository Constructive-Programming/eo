# Detached PR benchmark report — same-job, same-VM base/head comparison.
#
# Hand-maintained (like benchmarks.yml) — NOT generated by sbt
# githubWorkflowGenerate; keep it out of the sbt-typelevel config.
#
# workflow_run attaches this workflow to the default branch, NOT the PR
# head. CI remains on the PR; this report never gates its merge.
# Same-repo PRs only. Trusted planning/publishing run separately from sbt:
# the benchmark has no write token, persisted Git credentials, or cache saves.
# Only raw JMH JSON crosses that boundary; publisher scripts come from the
# default-branch workflow SHA, never from the benchmark checkout/artifact.

name: Benchmark A/B

on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number for A/B (blank for A/A calibration)"
        required: false
        default: ""
      mode:
        description: "A/B PR comparison or A/A default-branch noise calibration"
        type: choice
        options: [ab, aa]
        default: "ab"
      filter:
        description: "JMH class/method regex override (blank = affected/full)"
        required: false
        default: ""

permissions:
  contents: read

env:
  # The measurement profile. thresholds.json is calibrated against exactly
  # this string — change it and warnings are uncalibrated until an A/A
  # recalibration (delete thresholds.json in the same PR).
  #
  # Pinned allocation ergonomics (-XX:-ResizeTLAB + fixed heap): adaptive
  # TLAB sizing makes gc.alloc.rate.norm count environment-dependent retire
  # waste — PR #116 measured A/A swings of +78-81% B/op on
  # PlatedBench.visitorUniverseJson n=4096 across identical-source runs;
  # pinning took the same A/A to ±0.0%. Forks don't fix it (measured: -f 3
  # unpinned still ±11-41% — it is per-invocation environment state, not
  # per-fork sampling noise).
  JMH_PROFILE: "pr:-i3-wi2-f1-t1-gc-rt1g"
  JMH_FLAGS: "-i 3 -wi 2 -f 1 -t 1 -foe true -prof gc -rf json -jvmArgsAppend -XX:-ResizeTLAB -jvmArgsAppend -Xms1g -jvmArgsAppend -Xmx1g"

jobs:
  plan:
    name: Plan report
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Manual runs also belong on the default branch, not on the PR head.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    outputs:
      run: ${{ steps.plan.outputs.run }}
      pr: ${{ steps.plan.outputs.pr }}
      mode: ${{ steps.plan.outputs.mode }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
      regex: ${{ steps.plan.outputs.regex }}
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # This job reads Git objects but never executes PR code.

      - name: Bench tool self-test + mapping drift check
        run: |
          python3 -m unittest discover .github/bench
          python3 .github/bench/bench_tools.py validate-mapping

      - name: Resolve current PR and affected benchmarks
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/bench/pr_bench.py plan

  bench-ab:
    name: Measure (${{ needs.plan.outputs.mode }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: read
    concurrency:
      # A late old-head plan must not cancel a newer revision's measurement.
      group: bench-measure-${{ needs.plan.outputs.pr || 'calibration' }}-${{ needs.plan.outputs.head }}
      cancel-in-progress: true
    outputs:
      base_outcome: ${{ steps.base.outcome }}
      head_outcome: ${{ steps.head.outcome }}
    env:
      BASE_SHA: ${{ needs.plan.outputs.base }}
      HEAD_SHA: ${{ needs.plan.outputs.head }}
      REGEX: ${{ needs.plan.outputs.regex }}
    steps:
      - name: Checkout benchmark revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25 # kyoIntegration (KyoDiBench dep) targets JDK 25 since v0.15.0
      # workflow_run caches belong to the default branch. Never save
      # PR-produced cache contents into that trusted namespace.
      - name: Restore coursier + ivy + sbt boot
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/**/*.scala') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Base run (${{ needs.plan.outputs.base }})
        id: base
        continue-on-error: true # failure becomes an explicit ❌ comment state
        run: |
          git checkout --quiet "$BASE_SHA"
          sbt -batch -Dsbt.color=false \
            "benchmarks/Jmh/run $JMH_FLAGS -rff base.json $REGEX"

      - name: Head run (${{ needs.plan.outputs.head }})
        id: head
        continue-on-error: true
        run: |
          git checkout --quiet "$HEAD_SHA"
          sbt -batch -Dsbt.color=false \
            "benchmarks/Jmh/run $JMH_FLAGS -rff head.json $REGEX"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-raw-${{ github.run_id }}
          overwrite: true
          path: |
            benchmarks/base.json
            benchmarks/head.json
          retention-days: 30
          if-no-files-found: warn

  report:
    name: Publish report
    needs: [plan, bench-ab]
    if: always() && !cancelled() && needs.plan.outputs.run == 'true' && needs.bench-ab.result != 'cancelled'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      BASE_SHA: ${{ needs.plan.outputs.base }}
      HEAD_SHA: ${{ needs.plan.outputs.head }}
      PR_NUMBER: ${{ needs.plan.outputs.pr }}
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download raw JMH JSON
        id: download
        if: needs.bench-ab.outputs.base_outcome == 'success' && needs.bench-ab.outputs.head_outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: bench-raw-${{ github.run_id }}
          path: results

      - name: Diff and render comment
        id: diff
        env:
          BASE_OUTCOME: ${{ needs.bench-ab.outputs.base_outcome }}
          HEAD_OUTCOME: ${{ needs.bench-ab.outputs.head_outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          PROV=(--base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
                --jdk temurin-25 --runner ubuntu-22.04 \
                --jmh-params "$JMH_FLAGS" --profile "$JMH_PROFILE")
          TOOLFAIL=0
          if [ "$BASE_OUTCOME" != "success" ] || [ "$HEAD_OUTCOME" != "success" ] || [ "$DOWNLOAD_OUTCOME" != "success" ]; then
            TOOLFAIL=1
            FAIL="base: ${BASE_OUTCOME:-not run}, head: ${HEAD_OUTCOME:-not run}, results: $DOWNLOAD_OUTCOME — no comparison available; see run logs"
            python3 .github/bench/bench_tools.py comment-md --failure "$FAIL" > comment.md
          else
            # Exit 3 = B/op gate violation; any OTHER non-zero exit is a
            # tooling failure (e.g. truncated JMH JSON) and must render as
            # an explicit ❌ comment, never masquerade as a gate result.
            set +e
            python3 .github/bench/bench_tools.py diff \
              results/base.json results/head.json -o deltas.json "${PROV[@]}"
            RC=$?
            set -e
            if [ "$RC" -eq 0 ] || [ "$RC" -eq 3 ]; then
              python3 .github/bench/bench_tools.py comment-md deltas.json > comment.md
            else
              TOOLFAIL=$RC
              python3 .github/bench/bench_tools.py comment-md \
                --failure "bench tooling failed (diff exit $RC) — truncated JMH JSON? see run logs" > comment.md
            fi
          fi
          printf '\n_Informational only · head `%s` · [benchmark run](%s/%s/actions/runs/%s)_\n' \
            "$HEAD_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          echo "toolfail=$TOOLFAIL" >> "$GITHUB_OUTPUT"

      - name: Reject stale or closed PR results
        id: current
        if: needs.plan.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/bench/pr_bench.py check

      - name: Post sticky comment
        if: steps.current.outputs.current == 'true'
        # Pinned by SHA (v3.0.5): the one third-party action in a job with a
        # write scope.
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          number: ${{ needs.plan.outputs.pr }}
          header: bench-ab
          path: comment.md

      - name: A/A noise report
        if: needs.plan.outputs.mode == 'aa' && steps.diff.outputs.toolfail == '0'
        run: |
          python3 .github/bench/bench_tools.py noise-report deltas.json \
            | tee noise-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-ab-${{ github.run_id }}
          overwrite: true
          path: |
            deltas.json
            comment.md
            noise-report.md
          retention-days: 30
          if-no-files-found: warn

      # A tool crash is a broken pipeline, not a benchmark result — fail the
      # detached job loudly AFTER publishing any eligible ❌ comment.
      - name: Fail on tooling error
        if: steps.diff.outputs.toolfail != '0'
        run: |
          echo "Benchmark execution/results failed; see the run summary."
          exit 1

      # Threshold breaches are reported in the table, not as a merge gate.
