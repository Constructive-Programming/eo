// Scalafix rules for MAIN (non-test) code: the shared rule set plus bans that only make sense
// outside tests and laws. `build.sbt` points every project's `Compile / scalafixConfig` here
// (via `commonSettings`), except `laws` / `schemesLaws`, whose `src/main` IS law code; `Test`
// scopes keep `.scalafix.conf`.

include ".scalafix.conf"

DisableSyntax.regex = [
  {
    // `modify(identity)` writes back exactly what it read: in a library it is either dead work or
    // an idiom standing in for a real operation (see CLAUDE.md, "avoid unnecessary work"). It IS
    // the identity law, so specs and the laws modules may use it.
    id = noModifyIdentity
    pattern = "\\.modify\\(\\s*identity\\b"
    message = "`.modify(identity)` does no work; write the real operation instead (allowed only in tests and laws)"
  }
]
